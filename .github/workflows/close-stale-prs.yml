name: Close stale pull requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: |
            This PR has been inactive for 30 days.
            It will be closed in 7 days if there is no further activity.
          close-pr-message: |
            Closing this PR because it has been inactive for more than 30 days.
          remove-stale-when-updated: true
          exempt-pr-labels: 'keep-open,dependencies'
          exempt-authors: 'dependabot[bot]'
          stale-pr-label: 'stale'
          delete-branch: false
